name: Upstream release audit
'on':
  schedule:
  - cron: 37 4 * * *
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Compare upstream refs
      run: python ci/upstream_audit.py --output upstream-audit.json
      shell: bash
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: upstream-audit
        path: upstream-audit.json
        if-no-files-found: warn
        retention-days: 14
