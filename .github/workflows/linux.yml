# Linux build of the beam executable (interpreter and JIT).
# Requires BEAM_PACKAGE_SOURCE_DIR. The companion package repository is currently
# local-only; add a selected source checkout after publication. Missing sources
# intentionally fail configuration; do not skip acceptance or fetch a floating ref.

name: Linux

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        flavor: [emu, jit]

    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            perl \
            pkg-config \
            python3 \
            libpcre2-dev \
            libncurses-dev

      - name: Configure
        run: cmake --preset linux-${{ matrix.flavor }}

      - name: Build
        run: cmake --build --preset linux-${{ matrix.flavor }}

      - name: Test installed runtime and SDK
        run: ctest --test-dir build/linux-${{ matrix.flavor }} --output-on-failure
