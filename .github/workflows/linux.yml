name: Linux

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        flavor: [emu, jit]

    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare qualification prerequisites
        run: bash release/prepare-runner.sh

      - name: Release infrastructure checks
        run: python3 -m unittest discover -s release -p 'test_*.py'

      - name: Acquire pinned package source
        run: python3 release/release.py acquire --kind package --destination "$RUNNER_TEMP/inputs"

      - name: Configure
        run: cmake --preset linux-${{ matrix.flavor }} -DBEAM_PACKAGE_SOURCE_DIR="$RUNNER_TEMP/inputs/package"

      - name: Build
        run: cmake --build --preset linux-${{ matrix.flavor }}

      - name: Test installed runtime and SDK
        run: ctest --test-dir build/linux-${{ matrix.flavor }} --output-on-failure
