name: Publish release
permissions:
  contents: read
concurrency:
  group: release-publication
  cancel-in-progress: false
jobs:
  publish:
    environment: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Validate selection
      env:
        RUN: ${{ inputs.candidate_run }}
        DIGEST: ${{ inputs.manifest_sha256 }}
      run: |
        [[ "$RUN" =~ ^[0-9]+$ ]]
        [[ "$DIGEST" =~ ^[a-f0-9]{64}$ ]]
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: release-candidate
        path: ${{ runner.temp }}/release
        run-id: ${{ inputs.candidate_run }}
        github-token: ${{ github.token }}
    - name: Verify candidate origin, all gates and payload attestations
      env:
        GH_TOKEN: ${{ github.token }}
        RUN: ${{ inputs.candidate_run }}
        DIGEST: ${{ inputs.manifest_sha256 }}
      run: python3 release/promote.py prepare --directory "$RUNNER_TEMP/release" --run "$RUN" --digest "$DIGEST"
    - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
      with:
        subject-path: ${{ runner.temp }}/release/release-manifest.json
    - name: Prepare or verify retained offline material
      env:
        GH_TOKEN: ${{ github.token }}
        RUN: ${{ inputs.candidate_run }}
        DIGEST: ${{ inputs.manifest_sha256 }}
      run: python3 release/promote.py offline --directory "$RUNNER_TEMP/release" --run "$RUN" --digest "$DIGEST"
    - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
      with:
        subject-path: ${{ runner.temp }}/release/offline-verification.tar.gz
    - name: Promote verified bytes
      env:
        GH_TOKEN: ${{ github.token }}
        RUN: ${{ inputs.candidate_run }}
        DIGEST: ${{ inputs.manifest_sha256 }}
      run: python3 release/promote.py publish --directory "$RUNNER_TEMP/release" --run "$RUN" --digest "$DIGEST"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: verified-site-release
        path: ${{ runner.temp }}/release/site-release.json
'on':
  workflow_dispatch:
    inputs:
      candidate_run:
        description: Successful reviewed candidate run ID
        required: true
      manifest_sha256:
        description: Reviewed candidate-manifest.json SHA-256
        required: true
