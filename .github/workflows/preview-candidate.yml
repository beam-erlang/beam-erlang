name: Preview candidate
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: preview-candidate-${{ github.sha }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        flavor: [emu, jit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash release/prepare-runner.sh
      - run: python3 -m unittest discover -s release -p 'test_*.py'
      - name: Acquire exact package source
        run: python3 release/release.py acquire --kind package --destination "$RUNNER_TEMP/inputs"
      - name: Build complete SDK
        env:
          FLAVOR: ${{ matrix.flavor }}
        run: |
          cmake -S . -B "$RUNNER_TEMP/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DERTS_BUILD_FLAVOR="$FLAVOR" \
            -DBEAM_RELEASE_DEBUG_INFO=ON \
            -DBEAM_PACKAGE_SOURCE_DIR="$RUNNER_TEMP/inputs/package" \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/prefix"
          cmake --build "$RUNNER_TEMP/build" --parallel 2
          cmake --install "$RUNNER_TEMP/build"
      - name: Test and archive candidate, retaining failed qualification
        env:
          FLAVOR: ${{ matrix.flavor }}
        run: |
          mkdir -p "$RUNNER_TEMP/payload"
          status=0
          python3 release/release.py ctest --kind beam --build "$RUNNER_TEMP/build" \
            --report "$RUNNER_TEMP/payload/$FLAVOR-beam.json" || status=$?
          python3 release/release.py pack --flavor "$FLAVOR" --build "$RUNNER_TEMP/build" \
            --prefix "$RUNNER_TEMP/prefix" --package "$RUNNER_TEMP/inputs/package" \
            --output "$RUNNER_TEMP/payload"
          python3 release/bind-report.py "$RUNNER_TEMP/payload/$FLAVOR-beam.json" \
            "$RUNNER_TEMP/payload/candidate-$FLAVOR.json"
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: candidate-${{ matrix.flavor }}
          path: ${{ runner.temp }}/payload/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: build-diagnostics-${{ matrix.flavor }}
          path: |
            ${{ runner.temp }}/build/Testing/
            ${{ runner.temp }}/build/CMakeFiles/CMakeConfigureLog.yaml
          retention-days: 14
  acquired:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        flavor: [emu, jit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash release/prepare-runner.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-${{ matrix.flavor }}
          path: ${{ runner.temp }}/payload
      - run: python3 release/release.py acquire --kind package --destination "$RUNNER_TEMP/inputs"
      - name: Qualify acquired SDK and exact package payload
        env:
          FLAVOR: ${{ matrix.flavor }}
        run: |
          status=0
          python3 release/release.py acquired --record "$RUNNER_TEMP/payload/candidate-$FLAVOR.json" \
            --work "$RUNNER_TEMP/acceptance" --report "$RUNNER_TEMP/reports/$FLAVOR-acquired.json" || status=$?
          python3 release/qualify-package.py --record "$RUNNER_TEMP/payload/candidate-$FLAVOR.json" \
            --source "$RUNNER_TEMP/inputs/package" --work "$RUNNER_TEMP/package" \
            --report "$RUNNER_TEMP/reports/$FLAVOR-package.json" || status=$?
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: acquired-${{ matrix.flavor }}
          path: |
            ${{ runner.temp }}/reports/
            ${{ runner.temp }}/acceptance/*.log
            ${{ runner.temp }}/package/build/Testing/
          if-no-files-found: error
  otp:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        flavor: [emu, jit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash release/prepare-runner.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-${{ matrix.flavor }}
          path: ${{ runner.temp }}/payload
      - name: Acquire pinned OTP and qualification fixtures
        run: python3 release/release.py acquire --kind qualification --destination "$RUNNER_TEMP/inputs"
      - name: Complete OTP selection against acquired SDK
        env:
          FLAVOR: ${{ matrix.flavor }}
        run: |
          python3 release/qualify-otp.py --record "$RUNNER_TEMP/payload/candidate-$FLAVOR.json" \
            --inputs-dir "$RUNNER_TEMP/inputs" --work "$RUNNER_TEMP/otp" \
            --report "$RUNNER_TEMP/reports/$FLAVOR-otp.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: otp-${{ matrix.flavor }}
          path: |
            ${{ runner.temp }}/reports/
            ${{ runner.temp }}/otp/build/Testing/
            ${{ runner.temp }}/otp/build/checks/**/*.log
            ${{ runner.temp }}/otp/build/checks/**/*.json
            ${{ runner.temp }}/otp/build/checks/**/ct-result.term
            ${{ runner.temp }}/otp/build/checks/**/erl_crash.dump
            ${{ runner.temp }}/otp/build/checks/**/logs/**
            /tmp/otp-preview/**/*.log
            /tmp/otp-preview/**/*.json
            /tmp/otp-preview/**/ct-result.term
            /tmp/otp-preview/**/erl_crash.dump
            /tmp/otp-preview/**/logs/**
          if-no-files-found: warn
  collect:
    if: always()
    needs: [build, acquired, otp]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/downloaded
      - name: Collect qualification and immutable payloads
        run: |
          python3 release/collect-downloads.py "$RUNNER_TEMP/downloaded" "$RUNNER_TEMP/release"
          python3 release/release.py collect --directory "$RUNNER_TEMP/release" \
            --output "$RUNNER_TEMP/release/candidate-manifest.json"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: preview-release
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
